# shellcheck shell=bash
# =====================================================================
#  Vakuum OS Builder (kod-mini) — pinned upstream versions
# ---------------------------------------------------------------------
#  Sourced by scripts/lib/common.sh. Every value can be overridden from
#  the environment, e.g.:  KERNEL_VERSION=6.12.100 scripts/fetch.sh
# =====================================================================

# --- kod-mini itself ---------------------------------------------------
KOD_VERSION="${KOD_VERSION:-0.1}"

# --- GitHub ecosystem (kod-mini-*) -------------------------------------
KOD_GITHUB_ORG="${KOD_GITHUB_ORG:-VakuumOS}"
KOD_ROOTFS_REPO="${KOD_ROOTFS_REPO:-https://github.com/${KOD_GITHUB_ORG}/kod-mini-rootfs.git}"
KOD_ROOTFS_REF="${KOD_ROOTFS_REF:-main}"

# Stage 2: prebuilt static LLVM/Clang + LLD + Rust (musl) toolchain from
# kod-mini-toolchain. Empty = disabled. Example:
#   https://github.com/VakuumOS/kod-mini-toolchain/releases/download/v1/kod-toolchain-x86_64.tar.zst
KOD_TOOLCHAIN_URL="${KOD_TOOLCHAIN_URL:-}"
KOD_TOOLCHAIN_SHA256="${KOD_TOOLCHAIN_SHA256:-}"

# --- Linux kernel (6.12 LTS) -------------------------------------------
# "auto" = newest 6.12.x from kernel.org; falls back to the pinned value
# below when kernel.org metadata cannot be reached.
KERNEL_SERIES="${KERNEL_SERIES:-6.12}"
KERNEL_VERSION="${KERNEL_VERSION:-auto}"
KERNEL_FALLBACK_VERSION="${KERNEL_FALLBACK_VERSION:-6.12.119}"

# --- Userspace ---------------------------------------------------------
MUSL_VERSION="${MUSL_VERSION:-1.2.6}"
BUSYBOX_VERSION="${BUSYBOX_VERSION:-1.38.0}"
GNU_BASH_VERSION="${GNU_BASH_VERSION:-5.3}"
GNU_BASH_PATCHLEVEL="${GNU_BASH_PATCHLEVEL:-20}"
UTIL_LINUX_VERSION="${UTIL_LINUX_VERSION:-2.42.4}"
E2FSPROGS_VERSION="${E2FSPROGS_VERSION:-1.47.4}"
DOSFSTOOLS_VERSION="${DOSFSTOOLS_VERSION:-4.2}"

# --- Console localisation assets ---------------------------------------
# kbd: keymaps (ru/us) + fallback Cyrillic PSF fonts.
KBD_VERSION="${KBD_VERSION:-2.10.0}"
# Terminus: the preferred Cyrillic console font (ter-u16n / ter-u32n).
TERMINUS_VERSION="${TERMINUS_VERSION:-4.49.1}"

# --- Bootloader --------------------------------------------------------
LIMINE_REPO="${LIMINE_REPO:-https://github.com/limine-bootloader/limine.git}"
LIMINE_BRANCH="${LIMINE_BRANCH:-v8.x-binary}"

# --- Optional SHA-256 pins (empty = rely on upstream checksum files and
#     archive integrity tests performed by fetch.sh) ---------------------
MUSL_SHA256="${MUSL_SHA256:-}"
GNU_BASH_SHA256="${GNU_BASH_SHA256:-}"
UTIL_LINUX_SHA256="${UTIL_LINUX_SHA256:-}"
E2FSPROGS_SHA256="${E2FSPROGS_SHA256:-}"
DOSFSTOOLS_SHA256="${DOSFSTOOLS_SHA256:-}"
KBD_SHA256="${KBD_SHA256:-}"
TERMINUS_SHA256="${TERMINUS_SHA256:-}"
