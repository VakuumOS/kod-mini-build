# /etc/kod/swap.conf — read by vakuum-prep-swap
# Create temporary swap only when RAM is below this value (MiB).
KOD_SWAP_THRESHOLD_MB=4096
# Size swap files so that RAM + swap reaches this value (MiB).
KOD_SWAP_TOTAL_MB=8192
# Free space that must remain on the target filesystem (MiB).
KOD_SWAP_RESERVE_MB=2048
# At boot: put a swap file on a filesystem with this label, if present.
KOD_TARGET_LABEL=VAKUUM_ROOT
KOD_TARGET_MNT=/mnt/vakuum
KOD_SWAP_AUTO_TARGET=1
