# /etc/kod/console.conf — read by vakuum-console
# Fonts are searched in /usr/share/consolefonts in this order.
# For HiDPI screens put ter-u32n.psf first.
KOD_CONSOLE_FONTS="ter-u16n.psf ter-v16n.psf cyr-sun16.psfu UniCyr_8x16.psf"
# Keymap loaded at boot: ru (EN+RU, Ctrl+Shift toggles) or us.
KOD_CONSOLE_KEYMAP=ru
# Virtual terminals to configure.
KOD_CONSOLE_VTS="1 2 3 4 5 6"
